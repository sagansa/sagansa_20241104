# Konfigurasi analyzer untuk Sagansa Mobile.
# Lihat PRD_CODEBASE_IMPROVEMENT.md §4.12 untuk rasional aturan.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false
  errors:
    # Treat sebagai error (fail CI / review):
    missing_required_param: error
    missing_return: error
    # Treat sebagai warning (perlu perhatian, tidak block):
    deprecated_member_use: warning
    # Ignore yang noisy:
    todo: ignore
    fixme: ignore

linter:
  rules:
    # === Style konsistensi ===
    prefer_single_quotes: true
    prefer_final_fields: true
    prefer_final_locals: true
    # === Robustness ===
    avoid_print: true
    always_declare_return_types: true
    type_annotate_public_apis: true
    # === Imports ===
    prefer_relative_imports: true
    directives_ordering: true
    # === Flutter-specific ===
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    use_build_context_synchronously: true
    # === Public API docs (off — project internal) ===
    public_member_api_docs: false
    lines_longer_than_80_chars: false
