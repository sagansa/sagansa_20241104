
# Heap diturunkan dari 4096M -> 2048M (metaspace 1024m -> 512m) untuk mencegah
# OS OOM-kill (exit code -9 / SIGKILL) saat build --release di mesin 16 GB yang
# tertekan memori. R8/D8 butuh memori puncak; heap terlalu besar justru membuat
# JVM ditusuk OOM-killer sebelum sempat GC. Workers=1 & parallel=false menurunkan
# puncak pemakaian RAM dengan menukar kecepatan build.
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=true
