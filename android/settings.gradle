pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    // Firebase (FCM untuk on-demand location request): DINONAKTIFKAN sementara
    // sampai google-services.json tersedia. Dart code sudah mem-bungkus inisialisasi
    // Firebase dalam try/catch, jadi fitur app tetap jalan — hanya FCM push yang
    // tidak aktif. Untuk mengaktifkan kembali: taruh google-services.json di
    // android/app/ lalu uncomment baris ini + apply plugin di app/build.gradle.
    // id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
